name: note_app
description: Aplikasi catatan modern - offline first
publish_to: 'none'
version: 2.6.1+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.5+1

  # Database
  sqflite: ^2.4.5
  path: ^1.9.0
  path_provider: ^2.1.6

  # Storage lokal (setting)
  shared_preferences: ^2.5.3

  # File & share
  file_picker: ^13.3.1
  share_plus: ^10.0.2
  archive: ^4.0.7
  package_info_plus: ^8.3.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

  # Security
  crypto: ^3.0.8
  skeletonizer: ^1.4.3
  permission_handler: ^11.4.0
  local_auth: ^3.0.2

  # Google Drive backup
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2
  image_picker: ^1.2.4
  flutter_quill: ^10.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon_padded.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_padded.png"
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21
