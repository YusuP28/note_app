plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

// ===== SIGNING CONFIG =====
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

// Fallback: baca dari environment (untuk CI)
def envStoreFile = System.getenv("KEYSTORE_FILE") ?: keystoreProperties['storeFile']
def envStorePassword = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
def envKeyAlias = System.getenv("KEY_ALIAS") ?: keystoreProperties['keyAlias']
def envKeyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword']

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

// Google Sign-In serverClientId (dari google-services.json -> oauth_client type 3 / web)
def googleServerClientId = System.getenv("GOOGLE_SERVER_CLIENT_ID") ?: "YOUR_SERVER_CLIENT_ID.apps.googleusercontent.com"

android {
    namespace = "com.yusup28.note_app"
    compileSdk = 34
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId = "com.yusup28.note_app"
        minSdk = 21
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true

        // Pass serverClientId ke Dart via BuildConfig
        buildConfigField "String", "GOOGLE_SERVER_CLIENT_ID", "\"${googleServerClientId}\""
    }

    signingConfigs {
        release {
            if (envStoreFile != null && file(envStoreFile).exists()) {
                storeFile file(envStoreFile)
                storePassword envStorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Release WAJIB signed dengan keystore asli. Kalau keystore hilang
            // jangan fallback ke debug key - APK publik bisa di-re-sign dan
            // update bisa dipalsukan. Gagalkan build dengan pesan jelas.
            if (envStoreFile != null && file(envStoreFile).exists()) {
                signingConfig signingConfigs.release
            } else {
                throw new GradleException(
                    "Keystore release tidak ditemukan (storeFile='${envStoreFile}'). " +
                    "Set KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD di environment " +
                    "atau isi android/key.properties. Build release DITOLAK demi keamanan."
                )
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
