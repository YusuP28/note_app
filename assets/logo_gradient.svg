<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: purple → blue (brand) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <!-- Notebook paper gradient: white → light gray -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F4F6"/>
    </linearGradient>
    <!-- Accent gradient: gold/yellow (checkmark + pencil) -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Soft drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded background rectangle -->
  <rect x="0" y="0" width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- Notebook group (with shadow) -->
  <g filter="url(#shadow)">
    <!-- Paper shadow (offset for depth) -->
    <path d="M100,130 L330,130 L330,410 L100,410 Z" fill="#C2B7F0" opacity="0.12" transform="translate(4,4)"/>

    <!-- Paper base -->
    <path d="M88,122 L322,122 L322,398 L88,398 Z" fill="url(#paper)" stroke="#E5E7EB" stroke-width="1" rx="10"/>

    <!-- Fold corner (top right) -->
    <path d="M270,122 L322,122 L322,195 Z" fill="#F0F4F8" stroke="#E5E7EB" stroke-width="1"/>
    <path d="M270,122 L322,195 L270,195 Z" fill="#E8EEF4"/>

    <!-- Writing lines on paper -->
    <g stroke="#6B7280" stroke-width="1.2" opacity="0.4">
      <line x1="110" y1="195" x2="300" y2="195"/>
      <line x1="110" y1="235" x2="300" y2="235"/>
      <line x1="110" y1="275" x2="270" y2="275"/>
      <line x1="110" y1="315" x2="300" y2="315" stroke-dasharray="6,4"/>
      <line x1="110" y1="355" x2="250" y2="355" stroke-dasharray="6,4"/>
    </g>

    <!-- Checkmark + pencil symbol (top right) -->
    <g transform="translate(60, 65)" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <!-- Pencil diagonal (bottom-left to top-right) -->
      <path d="M0,190 L55,10"/>
      <!-- Pencil tip (triangle at top-right) -->
      <polygon points="38,50 55,15 38,35" fill="url(#gold)"/>
      <!-- Pencil eraser (small rect at bottom-left) -->
      <rect x="-8" y="165" width="24" height="14" rx="2" fill="url(#gold)"/>
      <!-- Checkmark -->
      <path d="M70,25 L90,45 L120,15"/>
    </g>
  </g>

  <!-- Outer subtle glow ring -->
  <rect x="14" y="14" width="484" height="484" rx="76" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.12"/>
</svg>
