<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background circle gradient: ungu muda -> biru tua -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Book page gradient: putih -> abu-abu muda -->
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>

    <!-- Gold gradient for check + pencil: emas -> oranye -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Spiral binding gradient -->
    <linearGradient id="spiralGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1D5DB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>

    <!-- Neumorphism soft shadow -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="4" stdDeviation="8" flood-color="#312E81" flood-opacity="0.25"/>
    </filter>

    <!-- Inner highlight for neumorphism -->
    <filter id="innerHighlight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feSpecularLighting surfaceScale="5" specularConstant="1" specularExponent="10" lighting-color="#FFFFFF" in="blur" result="spec">
        <fePointLight x="150" y="100" z="200"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec"/>
      <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <!-- Neumorphism pressed/raised effect -->
    <filter id="neumoEffect" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Dark shadow (bottom-right) -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur1"/>
      <feOffset dx="4" dy="4" result="offset1"/>
      <feFlood flood-color="#312E81" flood-opacity="0.3" result="color1"/>
      <feComposite in="color1" in2="offset1" operator="in" result="shadow1"/>

      <!-- Light highlight (top-left) -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur2"/>
      <feOffset dx="-3" dy="-3" result="offset2"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.6" result="color2"/>
      <feComposite in="color2" in2="offset2" operator="in" result="highlight1"/>

      <!-- Combine -->
      <feMerge>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="highlight1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGradient)" filter="url(#neumoEffect)"/>

  <!-- Subtle inner ring for depth -->
  <circle cx="256" cy="256" r="245" fill="none" stroke="url(#bgGradient)" stroke-width="2" opacity="0.3"/>

  <!-- Open book centered -->
  <g transform="translate(256, 256)" filter="url(#softShadow)">
    <!-- Book spine / left cover (3D effect) -->
    <path d="M-120,-130 L-80,-130 L-80,130 L-120,130 Z" fill="#E5E7EB" opacity="0.8"/>

    <!-- Left page (with spiral binding) -->
    <g>
      <!-- Page background -->
      <path d="M-80,-130 L40,-130 L40,130 L-80,130 Z" fill="url(#pageGradient)"/>

      <!-- Spiral binding (left edge of right page / left page) -->
      <g transform="translate(-80, -120)">
        <rect x="0" y="0" width="6" height="260" rx="3" fill="url(#spiralGradient)"/>
        <!-- Spiral holes -->
        <g fill="#9CA3AF" opacity="0.6">
          <circle cx="3" cy="15" r="2"/>
          <circle cx="3" cy="55" r="2"/>
          <circle cx="3" cy="95" r="2"/>
          <circle cx="3" cy="135" r="2"/>
          <circle cx="3" cy="175" r="2"/>
          <circle cx="3" cy="215" r="2"/>
          <circle cx="3" cy="255" r="2"/>
        </g>
      </g>

      <!-- Lines on left page -->
      <g stroke="#D1D5DB" stroke-width="1.5" opacity="0.5">
        <line x1="-50" y1="-70" x2="30" y2="-70"/>
        <line x1="-50" y1="-20" x2="30" y2="-20"/>
        <line x1="-50" y1="30" x2="10" y2="30"/>
        <line x1="-50" y1="80" x2="30" y2="80" stroke-dasharray="6,4"/>
      </g>
    </g>

    <!-- Right page -->
    <g>
      <!-- Page background -->
      <path d="M-40,-130 L140,-130 L140,130 L-40,130 Z" fill="url(#pageGradient)"/>

      <!-- Lines on right page -->
      <g stroke="#D1D5DB" stroke-width="1.5" opacity="0.5">
        <line x1="-10" y1="-70" x2="110" y2="-70"/>
        <line x1="-10" y1="-20" x2="110" y2="-20"/>
        <line x1="-10" y1="30" x2="90" y2="30"/>
        <line x1="-10" y1="80" x2="110" y2="80" stroke-dasharray="6,4"/>
        <line x1="-10" y1="130" x2="60" y2="130" stroke-dasharray="6,4"/>
      </g>

      <!-- Checkmark icon (top-right of right page) -->
      <g transform="translate(70, -90)" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0,12 L6,18 L18,-6" filter="url(#softShadow)"/>
      </g>

      <!-- Pencil icon (next to checkmark) -->
      <g transform="translate(100, -90)" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-4,18 L-4,2 L0,-4 L4,2 L4,18" filter="url(#softShadow)"/>
        <line x1="-4" y1="6" x2="4" y2="6"/>
        <polygon points="-4,2 0,-4 4,2" fill="url(#goldGradient)"/>
      </g>
    </g>

    <!-- Book cover bottom shadow for 3D thickness -->
    <path d="M-120,130 L-80,130 L-80,136 L-120,136 Z" fill="#312E81" opacity="0.15"/>
    <path d="M-80,130 L40,130 L40,136 L-80,136 Z" fill="#312E81" opacity="0.1"/>
    <path d="M-40,130 L140,130 L140,136 L-40,136 Z" fill="#312E81" opacity="0.1"/>
  </g>

  <!-- Subtle outer glow ring -->
  <circle cx="256" cy="256" r="254" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.2"/>
</svg>